<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>用户管理 · PHIX 维修社 · 上海民办平和学校</title>
<link rel="stylesheet" href="/static/site.css">
<meta name="mobile-css" content="/static/mobile-products.css">
<script src="/static/ua-switch.js"></script>
<style>
.admin-layout{max-width:960px;margin:0 auto;padding:32px 24px}
.admin-header{display:flex;align-items:center;gap:16px;margin-bottom:32px}
.admin-header h1{margin:0;font-size:1.5rem;font-weight:800;color:var(--ink)}
.admin-header .user-badge{font-size:.875rem;color:var(--ink-2);background:var(--phix-mist);padding:4px 12px;border-radius:999px;border:1px solid var(--phix-lilac)}
.admin-nav{display:flex;gap:12px;margin-bottom:32px;flex-wrap:wrap}
.admin-nav a{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border-radius:var(--radius-btn);border:1px solid var(--phix-lilac);color:var(--ink);text-decoration:none;font-weight:600;font-size:.9375rem;transition:all .18s ease}
.admin-nav a:hover,.admin-nav a.active{background:var(--phix-violet);color:#fff;border-color:var(--phix-violet)}
.admin-card{background:var(--paper);border:1px solid var(--phix-lilac);border-radius:var(--radius-card);padding:28px;box-shadow:var(--shadow-card)}
.user-table{width:100%;border-collapse:collapse;font-size:.875rem}
.user-table th{text-align:left;padding:10px 12px;border-bottom:2px solid var(--phix-lilac);color:var(--ink-2);font-weight:600;font-size:.8125rem;text-transform:uppercase;letter-spacing:.05em}
.user-table td{padding:10px 12px;border-bottom:1px solid var(--phix-lilac);color:var(--ink)}
.user-table tr:hover td{background:var(--phix-mist)}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.75rem;font-weight:600}
.badge-staff{background:var(--phix-violet);color:#fff}
.badge-super{background:var(--phix-rose);color:#fff}
.badge-active{background:#d1fae5;color:#065f46}
.badge-inactive{background:#fee2e2;color:#991b1b}
.btn-xs{height:28px;padding:0 10px;font-size:.75rem;border-radius:6px;border:1px solid var(--phix-lilac);background:var(--paper);color:var(--ink);cursor:pointer;font-weight:600;transition:all .15s}
.btn-xs:hover{background:var(--phix-mist);border-color:var(--phix-violet)}
.btn-xs.danger{color:#991b1b;border-color:#fca5a5}
.btn-xs.danger:hover{background:#fee2e2}
.msg-bar{margin-top:16px;padding:10px 14px;border-radius:var(--radius-btn);font-size:.875rem;display:none}
.msg-ok{background:#d1fae5;color:#065f46;display:block}
.msg-err{background:#fee2e2;color:#991b1b;display:block}
</style>
</head>
<body>

<header class="site-header">
  <div class="site-header__inner">
    <a class="brand" href="/" aria-label="phix 首页"><img src="/assets/logo-transparent.png" alt="phix"></a>
    <nav class="nav" aria-label="主导航"><ul class="nav__list">
      <li><a class="nav__link" href="/about/">关于我们</a></li>
      <li><a class="nav__link" href="/docs/">文档</a></li>
      <li><a class="nav__link" href="/log/">PHIX 日志</a></li>
    </ul></nav>
    <div class="site-header__actions">
      <a class="btn btn--sm btn--primary" href="/account/">个人中心</a>
    </div>
  </div>
</header>

<div class="admin-layout">
  <div class="admin-header">
    <h1>👥 用户管理</h1>
    <span class="user-badge">{{admin_username}}</span>
  </div>
  <div class="admin-nav">
    <a href="/admin/">概览</a>
    <a href="/admin/users/" class="active">用户管理</a>
    <a href="/admin/content/">页面文字</a>
    <a href="/admin/feedback/">反馈收件箱</a>
  </div>
  <div class="admin-card">
    <table class="user-table">
      <thead><tr><th>ID</th><th>用户名</th><th>角色</th><th>状态</th><th>注册时间</th><th>操作</th></tr></thead>
      <tbody id="user-list"><tr><td colspan="6" style="text-align:center;color:var(--ink-2)">加载中…</td></tr></tbody>
    </table>
    <div id="msg" class="msg-bar"></div>
  </div>
</div>

<footer class="site-footer">
  <div class="site-footer__inner">
    <div class="site-footer__col">
      <img class="site-footer__logo" src="/assets/logo-transparent.png" alt="phix">
      <p class="site-footer__blurb">{{cms:footer.blurb|上海民办平和学校 · 维修社 · 用代码装点校园生活}}</p>
    </div>
    <nav class="site-footer__links"><a href="/about/">关于我们</a><a href="/products/xinlv/">产品</a><a href="/download/">下载</a><a href="/log/">PHIX 日志</a></nav>
  </div>
  <div class="site-footer__copy">{{cms:footer.copyright|© 2026 phix}}</div>
</footer>
<script src="/static/site.js"></script>
<script>
async function loadUsers(){
  try{
    const r=await fetch('/admin/api/users');
    const d=await r.json();
    if(!d.ok){document.getElementById('user-list').innerHTML='<tr><td colspan="6">加载失败</td></tr>';return;}
    const tb=document.getElementById('user-list');
    tb.innerHTML='';
    for(const u of d.users){
      const badges=[];
      if(u.is_superuser)badges.push('<span class="badge badge-super">超管</span>');
      if(u.is_staff)badges.push('<span class="badge badge-staff">Staff</span>');
      const statusBadge=u.is_active?'<span class="badge badge-active">启用</span>':'<span class="badge badge-inactive">停用</span>';
      const dt=(u.date_joined||'').slice(0,10);
      const toggleActive=u.is_active
        ?`<button class="btn-xs danger" onclick="setFlag(${u.id},'is_active',false)">停用</button>`
        :`<button class="btn-xs" onclick="setFlag(${u.id},'is_active',true)">启用</button>`;
      const toggleStaff=u.is_staff
        ?`<button class="btn-xs danger" onclick="setFlag(${u.id},'is_staff',false)">撤 Staff</button>`
        :`<button class="btn-xs" onclick="setFlag(${u.id},'is_staff',true)">设 Staff</button>`;
      tb.insertAdjacentHTML('beforeend',
        `<tr><td>${u.id}</td><td>${u.username}</td><td>${badges.join(' ')||'-'}</td><td>${statusBadge}</td><td>${dt}</td><td style="display:flex;gap:4px">${toggleActive}${toggleStaff}</td></tr>`);
    }
  }catch(e){document.getElementById('user-list').innerHTML='<tr><td colspan="6">网络错误</td></tr>';}
}
function showMsg(text,ok){
  const el=document.getElementById('msg');
  el.textContent=text;el.className='msg-bar '+(ok?'msg-ok':'msg-err');
  setTimeout(()=>{el.className='msg-bar';},4000);
}
async function setFlag(uid,flag,val){
  try{
    const r=await fetch('/admin/api/user/flags',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:uid,[flag]:val})});
    const d=await r.json();
    if(d.ok!==false&&r.status===200){showMsg('操作成功',true);loadUsers();}
    else{showMsg(d.error?.message||'操作失败',false);}
  }catch(e){showMsg('网络错误',false);}
}
loadUsers();
</script>
</body>
</html>
